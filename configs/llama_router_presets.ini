# llama.cpp router preset for AMD RX 6700 XT 12 GB + 64 GB DDR4 (Windows 11 / Vulkan)
#
# Launch example (local loopback):
#   C:\llama.cpp\llama.exe serve --models-dir C:\models --models-preset configs\llama_router_presets.ini --models-max 1 --host 127.0.0.1 --port 9931
#
# Swap --host 127.0.0.1 to your workstation LAN or direct-link IP when serving remote Pi clients.
# Adjust model section names ([Inkling-2-Mini-UD-Q4_K_XL]) to match your GGUF filenames in C:\models.

[*]
n-gpu-layers = all
ctx-size = 32768
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
jinja = true

[Inkling-2-Mini-UD-Q4_K_XL]
n-gpu-layers = 99
ctx-size = 32768
parallel = 1
load-mode = none
ubatch-size = 512
override-tensor = blk\.([0-5]|1[8-9]|2[0-3])\.ffn_.*_exps\.=CPU
reasoning-effort = low
reasoning-budget = 1024
no-reasoning-preserve = true
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0

[Inkling-2-Mini-UD-Q3_K_XL]
n-gpu-layers = 99
ctx-size = 32768
parallel = 1
load-mode = none
ubatch-size = 512
override-tensor = blk\.([0-5]|1[8-9]|2[0-3])\.ffn_.*_exps\.=CPU
reasoning-effort = low
reasoning-budget = 1024
no-reasoning-preserve = true
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
